name: "kaakaa/slidev-resources-template/checkOGP"
description: |
  Check if OGP is enabled

inputs:
  file:
    description: slidev entry file
    required: true
outputs:
  ogp:
    description: "if OGP is enabled, this value is true. otherwise, this value is false."
    value: ${{ steps.frontmatter.outputs.ogp }}
runs:
  using: "composite"
  steps:
    # yq は ubuntu ランナーに同梱されている (ubuntu-24.04 で v4.53.6) ため
    # 都度ダウンロードしない
    - name: Frontmatter
      id: frontmatter
      shell: bash
      env:
        FILE: ${{ inputs.file }}
      run: |
        echo "ogp=$(yq --front-matter=extract '.githubPages.ogp' "$FILE" | tr -d '\n')" >> "$GITHUB_OUTPUT"
