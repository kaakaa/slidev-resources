name: Release slidev
on:
  push:
    tags:
      - "*"

concurrency: release-slidev

env:
  SLIDE: ${{ github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # タグ名をそのままスライドのディレクトリ名として使うので、先に存在を確認する。
      # (打ち間違えたタグで npm ci まで走ってから失敗するのを防ぐ)
      - name: Validate that the tag matches a slide directory
        run: |
          if [ ! -f "${SLIDE}/slides.md" ]; then
            echo "::error::Tag '${SLIDE}' does not match a slide directory. Expected '${SLIDE}/slides.md' to exist."
            exit 1
          fi

      - name: Install Japanese font
        run: sudo apt-get install -y fonts-noto

      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # index.html の各スライドの日付は gh-pages の commit 履歴から引くため、
      # 全履歴が必要 (shallow だと全件が同じ日付になる)
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      # .nvmrc は 22 だが、ここでは 20 に固定する。
      # pdf-img-convert -> canvas@2.11.2 に Node 22 (ABI node-v127) 用の
      # ビルド済みバイナリが無く、ソースビルドに落ちて pixman-1 が無いと失敗するため。
      # canvas が Node 22 に対応したら .nvmrc に揃える。
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Export slidev as PDF
        run: npm run export --slide="${SLIDE}" && npm run export:dark --slide="${SLIDE}"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.pdf

      - name: Check if OGP is enabled
        id: checkOGP
        uses: ./.github/actions/checkOGP
        with:
          file: ${{ env.SLIDE }}/slides.md

      - name: Generate index.html before building SPA
        if: ${{ steps.checkOGP.outputs.ogp == 'true' }}
        run: npm run build:before --slide="${SLIDE}" --pagesurl=${{ steps.configure-pages.outputs.base_url }}

      - name: Build slidev as SPA
        run: npm run build --slide="${SLIDE}"

      - name: Generate preview image for OGP
        if: ${{ steps.checkOGP.outputs.ogp == 'true' }}
        run: npm run build:after --slide="${SLIDE}"

      # ビルド成果物を gh-pages の作業ツリーへ取り込み、index を作り直してから
      # 1度だけ deploy する (以前は SPA と index で2回 push しており、
      # pages-build-deployment も2回走っていた)
      - name: Merge built slide into gh-pages tree
        run: |
          mkdir -p "gh-pages/${SLIDE}"
          cp -r "docs/${SLIDE}/." "gh-pages/${SLIDE}/"

      - name: Update index page
        run: npm run update-index-page --pagesdir=gh-pages/

      - name: Deploy pages
        uses: crazy-max/ghaction-github-pages@v5
        with:
          keep_history: true
          build_dir: ./gh-pages
          verbose: true
          # .nojekyll を置かせる。Jekyll が有効だとアンダースコア始まりの
          # ファイルが配信されず、Slidev が出力する
          # assets/_plugin-vue_export-helper-*.js が 404 になる
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
