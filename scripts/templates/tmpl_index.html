<!DOCTYPE html>
<html lang="ja">
<head>
    {{#if analyticsId}}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{analyticsId}}"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{analyticsId}}');
    </script>
    {{/if}}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides | kaakaa</title>
    <meta name="description" content="kaakaa が Slidev で作成したスライドの一覧">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fbfbfd;
            --bg-grid: #0000000a;
            --card: #ffffff;
            --card-border: #e6e6ec;
            --fg: #16161a;
            --fg-muted: #6b6b78;
            --fg-faint: #9a9aa8;
            --accent: #3b6cf0;
            --shadow: 0 1px 2px rgba(16, 16, 32, .04), 0 4px 16px rgba(16, 16, 32, .06);
            --shadow-hover: 0 2px 4px rgba(16, 16, 32, .06), 0 12px 32px rgba(16, 16, 32, .12);
            --radius: 14px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e11;
                --bg-grid: #ffffff0a;
                --card: #17171c;
                --card-border: #2a2a33;
                --fg: #ececf1;
                --fg-muted: #a0a0ae;
                --fg-faint: #6e6e7c;
                --accent: #7fa0ff;
                --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
                --shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 12px 32px rgba(0, 0, 0, .45);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 24px 96px;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                         "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
            color: var(--fg);
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 56px 56px, 56px 56px;
            -webkit-font-smoothing: antialiased;
        }

        .wrap { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 16px;
            padding: 64px 4px 40px;
        }
        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -.02em;
        }
        .count {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--fg-muted);
            padding: 3px 10px;
            border: 1px solid var(--card-border);
            border-radius: 999px;
            background: var(--card);
        }
        .repo {
            margin-left: auto;
            font-size: 13px;
            color: var(--fg-muted);
            text-decoration: none;
        }
        .repo:hover { color: var(--accent); }

        .slides {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .slide {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
        }
        .slide:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--accent) 35%, var(--card-border));
        }
        .slide:has(a:focus-visible) {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .slide > a {
            display: block;
            color: inherit;
            text-decoration: none;
        }
        .slide > a:focus-visible { outline: none; }

        .thumb {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: color-mix(in srgb, var(--fg) 6%, transparent);
            border-bottom: 1px solid var(--card-border);
        }

        .body { padding: 16px 18px 18px; }

        .title {
            margin: 0;
            font-size: 17px;
            font-weight: 650;
            line-height: 1.35;
            letter-spacing: -.01em;
            text-transform: capitalize;
        }
        .slide:hover .title { color: var(--accent); }

        .slug {
            margin-top: 6px;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            color: var(--fg-faint);
            word-break: break-all;
        }

        .meta {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--fg-muted);
            font-variant-numeric: tabular-nums;
        }
        .meta svg { width: 13px; height: 13px; flex: none; opacity: .7; }

        footer {
            max-width: 1200px;
            margin: 64px auto 0;
            padding: 24px 4px 0;
            border-top: 1px solid var(--card-border);
            font-size: 12px;
            color: var(--fg-faint);
        }
        footer a { color: var(--fg-muted); }

        @media (prefers-reduced-motion: reduce) {
            .slide { transition: none; }
            .slide:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Slides</h1>
            <span class="count">{{entries.length}} decks</span>
            <a class="repo" href="https://github.com/kaakaa/slidev-resources">kaakaa/slidev-resources &nearr;</a>
        </header>

        <ul class="slides">
            {{#each entries}}
            <li class="slide">
                <a href="./{{this.name}}">
                    <img class="thumb" loading="lazy" decoding="async"
                         src="./{{this.name}}/preview.png"
                         alt="{{this.title}} のプレビュー"
                         onerror="this.onerror=null; this.src='./404.png';">
                    <div class="body">
                        <h2 class="title">{{this.title}}</h2>
                        <div class="slug">{{this.name}}</div>
                        <div class="meta">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="18" rx="2"/>
                                <path d="M16 2v4M8 2v4M3 10h18"/>
                            </svg>
                            <time datetime="{{this.date}}">{{this.date}}</time>
                        </div>
                    </div>
                </a>
            </li>
            {{/each}}
        </ul>

        <footer>
            Built with <a href="https://sli.dev">Slidev</a>.
            各スライドの PDF は <a href="https://github.com/kaakaa/slidev-resources/releases">Releases</a> から取得できます。
        </footer>
    </div>
</body>
</html>
